[project]
name = "motregen-skywatch"
version = "0.1.0"
description = "De Bilt webcam and weather-model measurement rig"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
skywatch-poll = "skywatch.poll:main"

[dependency-groups]
dev = [
  "pyright>=1.1.406",
  "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skywatch"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
