[package]
name = "mrf"
version = "0.1.0"
edition = "2024"
description = "Encoder and decoder for motregen rain-frame chunks"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
base64 = "0.22"
proptest = "1.6"
